name: Falcon VPN Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project-extract

          # Prefer a Gradle Android project already checked into the repository.
          SETTINGS_FILE="$(find . -type f \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path './.git/*' -not -path './project-extract/*' -print -quit)"

          # Otherwise extract a known Android source ZIP; ignore design-only ZIPs.
          if [ -z "$SETTINGS_FILE" ]; then
            ZIP_FILE=""
            if [ -f "FalconVPN-Starter.zip" ]; then
              ZIP_FILE="FalconVPN-Starter.zip"
            else
              ZIP_FILE="$(find . -maxdepth 2 -type f -name 'FalconVPN-Android-Prototype-*.zip' -print -quit)"
            fi

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Android Gradle project or Android source ZIP found. An HTML design file alone cannot build an APK. Add app/, settings.gradle.kts, and build.gradle.kts, or upload FalconVPN-Android-Prototype-*.zip."
              exit 1
            fi

            unzip -q "$ZIP_FILE" -d project-extract
            SETTINGS_FILE="$(find project-extract -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)"
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Could not find settings.gradle(.kts) in the repository or extracted Android ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: Found Gradle settings at $PROJECT_DIR but no app/build.gradle(.kts). This is not a complete Android app project."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using Android project at: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Falcon-VPN-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
